name: LF PaperBot Backfill

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYYMMDD)"
        required: true
        default: "20260101"
        type: string
      end:
        description: "End date (YYYYMMDD), blank means today"
        required: false
        type: string
      force:
        description: "Reprocess existing paper versions"
        required: false
        default: false
        type: boolean
      all_papers:
        description: "Collect every relevant paper without the weekly Top 5 limit"
        required: false
        default: true
        type: boolean
      candidate_file:
        description: "Optional committed public metadata snapshot path"
        required: false
        type: string

concurrency:
  group: lf-paperbot-weekly
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GITHUB_TOKEN: ${{ github.token }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: deepseek-flash
      LF_GITHUB_REPO: WendingZhao/LF-PaperBot
      LF_MAX_DAILY_PAPERS: "5"
      LF_LOOKBACK_DAYS: "7"
      LF_SOURCES: arxiv,crossref,cvf
      LF_TIMEZONE: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install -r requirements.txt
      - name: Doctor
        shell: bash
        run: |
          set +e
          python -m lf_paperbot doctor | tee "$RUNNER_TEMP/lf-paperbot-doctor.log"
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "## LF-PaperBot Doctor"
            echo '```text'
            cat "$RUNNER_TEMP/lf-paperbot-doctor.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Backfill weekly archive
        env:
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_ALL: ${{ inputs.all_papers }}
          INPUT_CANDIDATES: ${{ inputs.candidate_file }}
        run: |
          set -euo pipefail
          end_arg=()
          force_arg=()
          all_arg=()
          candidate_arg=()
          if [[ -n "${INPUT_END:-}" ]]; then end_arg=(--end "$INPUT_END"); fi
          if [[ "${INPUT_FORCE:-false}" == "true" ]]; then force_arg=(--force); fi
          if [[ "${INPUT_ALL:-true}" == "true" ]]; then all_arg=(--all); fi
          if [[ -n "${INPUT_CANDIDATES:-}" ]]; then candidate_arg=(--candidate-file "$INPUT_CANDIDATES"); fi
          if [[ -n "${INPUT_CANDIDATES:-}" ]]; then
            pending_sources=$(python -c 'import json,os; d=json.load(open(os.environ["INPUT_CANDIDATES"])); print(",".join(k for k,v in d["sources"].items() if v["status"]!="ok"))')
            if [[ -n "$pending_sources" ]]; then
              python -m lf_paperbot discover --start "$INPUT_START" "${end_arg[@]}" --output "$INPUT_CANDIDATES" --sources "$pending_sources" || echo "Some sources remain incomplete; preserving available results"
            fi
          fi
          git config user.name "LF-PaperBot[bot]"
          git config user.email "lf-paperbot[bot]@users.noreply.github.com"
          if [[ -n "${INPUT_CANDIDATES:-}" ]]; then
            git add -- "$INPUT_CANDIDATES"
            if ! git diff --cached --quiet; then
              git commit -m "chore: refresh public history candidates"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
          python -m lf_paperbot backfill --start "$INPUT_START" "${end_arg[@]}" "${force_arg[@]}" "${all_arg[@]}" "${candidate_arg[@]}" --monthly --commit
      - name: Preserve partial results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lf-history-partial-results
          path: |
            papers/*.json
            daily_reports
            docs/data
          retention-days: 14
      - name: Commit generated artifacts
        if: always()
        run: |
          set -euo pipefail
          git config user.name "LF-PaperBot[bot]"
          git config user.email "lf-paperbot[bot]@users.noreply.github.com"
          git add papers/index.json daily_reports docs/data docs/assets/previews
          if [[ -f papers/backfill_status.json ]]; then git add papers/backfill_status.json; fi
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore: backfill weekly LF paper archive"
          git pull --rebase origin main
          git push origin HEAD:main
