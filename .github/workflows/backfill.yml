name: LF PaperBot Backfill

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYYMMDD)"
        required: true
        default: "20260101"
        type: string
      end:
        description: "End date (YYYYMMDD), blank means today"
        required: false
        type: string
      force:
        description: "Reprocess existing paper versions"
        required: false
        default: false
        type: boolean

concurrency:
  group: lf-paperbot-weekly
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
      ARK_BASE_URL: https://ark.cn-beijing.volces.com/api/coding/v3
      ARK_MODEL: ark-code-latest
      LF_GITHUB_REPO: WendingZhao/LF-PaperBot
      LF_MAX_DAILY_PAPERS: "5"
      LF_LOOKBACK_DAYS: "7"
      LF_TIMEZONE: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install -r requirements.txt
      - name: Doctor
        shell: bash
        run: |
          set +e
          python -m lf_paperbot doctor | tee "$RUNNER_TEMP/lf-paperbot-doctor.log"
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "## LF-PaperBot Doctor"
            echo '```text'
            cat "$RUNNER_TEMP/lf-paperbot-doctor.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Backfill weekly archive
        env:
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          end_arg=()
          force_arg=()
          if [[ -n "${INPUT_END:-}" ]]; then end_arg=(--end "$INPUT_END"); fi
          if [[ "${INPUT_FORCE:-false}" == "true" ]]; then force_arg=(--force); fi
          python -m lf_paperbot backfill --start "$INPUT_START" "${end_arg[@]}" "${force_arg[@]}"
      - name: Commit generated artifacts
        run: |
          set -euo pipefail
          git config user.name "LF-PaperBot[bot]"
          git config user.email "lf-paperbot[bot]@users.noreply.github.com"
          git add papers/index.json daily_reports docs/data docs/assets/previews
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore: backfill weekly LF paper archive"
          git pull --rebase origin main
          git push origin HEAD:main
