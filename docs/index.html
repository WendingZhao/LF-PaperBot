<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="每周普通光场图像广义底层视觉论文追踪与分析" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%236750a4%22/><circle cx=%2232%22 cy=%2232%22 r=%2217%22 fill=%22none%22 stroke=%22white%22 stroke-width=%226%22/><circle cx=%2232%22 cy=%2232%22 r=%226%22 fill=%22white%22/></svg>" />
    <title>LF-PaperBot · 光场底层视觉周报</title>
    <style>
      :root { color-scheme: light dark; --bg:#f6f7fb; --panel:#fff; --text:#172033; --muted:#647087; --line:#dfe3eb; --accent:#6750a4; --accent2:#0f8b8d; --shadow:0 18px 50px rgba(29,35,58,.10) }
      @media(prefers-color-scheme:dark){:root{--bg:#10131b;--panel:#181d28;--text:#edf1fa;--muted:#aab3c5;--line:#303747;--accent:#bca7ff;--accent2:#70d7d0;--shadow:0 18px 50px rgba(0,0,0,.3)}}
      *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,rgba(103,80,164,.15),transparent 28%),var(--bg);color:var(--text);font:15px/1.65 ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif}
      a{color:inherit}.shell{max-width:1240px;margin:auto;padding:28px 20px 64px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:center;padding:30px;border:1px solid var(--line);border-radius:26px;background:color-mix(in srgb,var(--panel) 92%,transparent);box-shadow:var(--shadow)}
      .eyebrow{margin:0 0 8px;color:var(--accent);font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero h1{margin:0;font-size:clamp(2rem,6vw,4.4rem);line-height:1;letter-spacing:-.055em}.hero p{max-width:720px;margin:16px 0 0;color:var(--muted)}.hero-actions{display:flex;flex:none;flex-wrap:wrap;justify-content:flex-end;gap:10px}.repo{padding:11px 16px;border:1px solid var(--line);border-radius:999px;text-decoration:none;background:var(--panel)}
      .controls{display:grid;grid-template-columns:minmax(220px,1fr) 220px 220px;gap:12px;margin:22px 0}.controls input,.controls select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);font:inherit}
      .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{padding:15px 18px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.stat strong{display:block;font-size:1.5rem}.stat span{color:var(--muted)}
      .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{display:grid;grid-template-columns:128px 1fr;min-height:210px;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:0 10px 30px rgba(29,35,58,.06)}.cover{width:100%;height:100%;object-fit:cover;object-position:top;background:var(--line)}.card-body{padding:18px;min-width:0}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-size:.77rem;font-weight:700}.version{color:var(--accent2)}.card h2{margin:10px 0 8px;font-size:1.08rem;line-height:1.35}.card p{margin:0;color:var(--muted)}.meta{margin-top:10px!important;font-size:.82rem}.actions{display:flex;gap:10px;margin-top:14px}.actions a,.actions button{border:0;border-radius:10px;padding:8px 11px;background:var(--accent);color:#fff;font:inherit;text-decoration:none;cursor:pointer}.actions a.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent)}
      .empty{grid-column:1/-1;padding:70px 20px;text-align:center;border:1px dashed var(--line);border-radius:20px;color:var(--muted)}dialog{width:min(850px,calc(100% - 28px));max-height:88vh;border:1px solid var(--line);border-radius:22px;padding:0;background:var(--panel);color:var(--text);box-shadow:var(--shadow)}dialog::backdrop{background:rgba(4,8,18,.68);backdrop-filter:blur(5px)}.dialog-head{position:sticky;top:0;display:flex;justify-content:space-between;gap:15px;padding:20px 24px;border-bottom:1px solid var(--line);background:var(--panel)}.dialog-head h2{margin:0;font-size:1.25rem}.close{border:0;background:none;color:var(--muted);font-size:1.6rem;cursor:pointer}.detail{padding:10px 24px 28px}.detail h3{margin:22px 0 6px;color:var(--accent)}footer{margin-top:34px;text-align:center;color:var(--muted)}
      @media(max-width:820px){.hero{align-items:flex-start;flex-direction:column}.hero-actions{justify-content:flex-start}.controls{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.card{grid-template-columns:92px 1fr}.shell{padding-inline:12px}.hero{padding:22px}}
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div><p class="eyebrow">Light Field · Low-Level Vision</p><h1>LF-PaperBot</h1><p>每周追踪普通光场图像的超分、恢复、重建、深度与视差估计等广义底层视觉论文。严格排除非普通图像模态，提供中文结构化解读。</p></div>
        <div class="hero-actions"><a class="repo" href="https://aqu1ver.fun/">← 个人主页</a><a class="repo" href="https://github.com/WendingZhao/LF-PaperBot">GitHub ↗</a></div>
      </section>
      <section class="controls" aria-label="筛选">
        <input id="search" type="search" placeholder="搜索标题、作者或摘要…" />
        <select id="task"><option value="">全部任务</option></select>
        <select id="date"><option value="">全部日期</option></select>
      </section>
      <section class="stats"><div class="stat"><strong id="paperCount">0</strong><span>收录论文</span></div><div class="stat"><strong id="reportCount">0</strong><span>周报期数</span></div><div class="stat"><strong id="updatedAt">—</strong><span>最近更新</span></div></section>
      <section id="papers" class="grid" aria-live="polite"><div class="empty">正在加载论文索引…</div></section>
      <footer>LF-PaperBot · 数据与结论请以论文原文为准</footer>
    </main>
    <dialog id="detail"><div class="dialog-head"><h2 id="detailTitle"></h2><button class="close" aria-label="关闭">×</button></div><article id="detailBody" class="detail"></article></dialog>
    <script>
      const state={data:null,task:'',date:'',query:''};
      const $=id=>document.getElementById(id); const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
      const fmtDate=value=>value?new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(value)):'—';
      function options(){const tasks=[...new Set(state.data.papers.flatMap(p=>p.tasks||[]))].sort();for(const task of tasks)$('task').insertAdjacentHTML('beforeend',`<option>${esc(task)}</option>`);for(const date of Object.keys(state.data.reports||{}).sort().reverse())$('date').insertAdjacentHTML('beforeend',`<option value="${date}">${date.slice(0,4)}-${date.slice(4,6)}-${date.slice(6)}</option>`)}
      function filtered(){return state.data.papers.filter(p=>{const hay=`${p.title} ${(p.authors||[]).join(' ')} ${p.abstract}`.toLowerCase();return(!state.task||(p.tasks||[]).includes(state.task))&&(!state.date||(p.appeared_dates||[]).includes(state.date))&&(!state.query||hay.includes(state.query))})}
      function card(p){const chips=(p.tasks||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join('');const update=p.is_version_update?'<span class="chip version">版本更新</span>':'';return `<article class="card"><img class="cover" src="${esc(p.cover_url||'')}" alt="${esc(p.title)} 首页" loading="lazy"/><div class="card-body"><div class="chips">${chips}${update}</div><h2>${esc(p.title)}</h2><p>${esc(p.report?.tldr||p.abstract||'暂无摘要')}</p><p class="meta">v${esc(p.version)} · ${esc((p.authors||[]).slice(0,3).join(', '))} · ${Number(p.rank_score||0).toFixed(2)}</p><div class="actions"><button data-id="${esc(p.base_id)}">阅读分析</button><a class="secondary" href="${esc(p.issue_url)}">Issue ↗</a></div></div></article>`}
      function render(){const rows=filtered();$('papers').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">没有匹配当前条件的论文。</div>'}
      function openDetail(id){const p=state.data.papers.find(item=>item.base_id===id);if(!p)return;const sections=[['一句话结论','tldr'],['任务与退化模型','problem'],['空间—角度建模','modeling'],['核心方法与创新','method'],['去遮挡机制','occlusion'],['实验、数据集与指标','experiments'],['代码、模型与数据','resources'],['局限与复现风险','limitations'],['研究启发','insight']];$('detailTitle').textContent=p.title;$('detailBody').innerHTML=`<p>${esc((p.authors||[]).join(', '))}</p>${sections.map(([title,key])=>`<h3>${title}</h3><p>${esc(p.report?.[key]||'论文材料未说明')}</p>`).join('')}<p><a href="${esc(p.issue_url)}">在 GitHub Issue 阅读完整报告与讨论 ↗</a></p>`;$('detail').showModal()}
      async function init(){try{const response=await fetch('./data/index.json',{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);state.data=await response.json();$('paperCount').textContent=state.data.papers.length;$('reportCount').textContent=Object.keys(state.data.reports||{}).length;$('updatedAt').textContent=fmtDate(state.data.updated_at);options();render()}catch(error){$('papers').innerHTML=`<div class="empty">论文索引加载失败：${esc(error.message)}</div>`}}
      $('search').addEventListener('input',e=>{state.query=e.target.value.trim().toLowerCase();render()});$('task').addEventListener('change',e=>{state.task=e.target.value;render()});$('date').addEventListener('change',e=>{state.date=e.target.value;render()});$('papers').addEventListener('click',e=>{const button=e.target.closest('button[data-id]');if(button)openDetail(button.dataset.id)});document.querySelector('.close').addEventListener('click',()=>$('detail').close());init();
    </script>
  </body>
</html>
